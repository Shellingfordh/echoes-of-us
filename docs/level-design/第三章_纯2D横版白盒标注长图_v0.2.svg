      .hazard { fill: #482f35; stroke: #ff6379; stroke-width: 4; }
      .daughter-only { fill: #173f50; stroke: #49c7ff; stroke-width: 4; }
      .anchor { fill: #113e31; stroke: #54e0a2; stroke-width: 4; }
      .route-main { fill: none; stroke: #f4b84b; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowMain); }
      .route-daughter { fill: none; stroke: #49c7ff; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowDaughter); }
      .route-mother { fill: none; stroke: #ff8093; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowMother); }
      .tie { fill: none; stroke: #ff3d58; stroke-width: 5; stroke-linecap: round; filter: url(#redGlow); }
      .leader { fill: none; stroke: #d9e3e7; stroke-width: 2.5; }
      .callout { fill: #12202a; stroke: #d9e3e7; stroke-width: 2; }
      .note-yellow { fill: #231e12; stroke: #f4b84b; stroke-width: 3; }
      .num { font-size: 22px; font-weight: 900; text-anchor: middle; dominant-baseline: central; }
    </style>

