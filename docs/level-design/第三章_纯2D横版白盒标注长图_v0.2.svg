<svg xmlns="http://www.w3.org/2000/svg" width="3600" height="1400" viewBox="0 0 3600 1400">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#31404a" stroke-width="1" opacity="0.52"/>
