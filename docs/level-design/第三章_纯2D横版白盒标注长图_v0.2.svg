  <rect x="2450" y="500" width="500" height="95" rx="10" class="note-yellow"/><text x="2470" y="540" class="label">流程 12→14：母亲锚定 → 女儿锚定 → 母亲锚定</text><text x="2470" y="572" class="small">每次都由到达高处的人接替成为稳定端</text>

