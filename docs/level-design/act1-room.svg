<svg viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3d405b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="470" fill="#f4f1de"/>

  <text x="340" y="30" font-size="20" font-weight="700" fill="#3d405b" text-anchor="middle">Act 1｜女儿房间（8m × 5m，俯视）</text>
  <text x="340" y="50" font-size="12" fill="#3d405b" opacity="0.7" text-anchor="middle">核心物件亮度 +20%；可选记忆碎片（床底耳机 / 柜顶相框）需借助木椅</text>

  <!-- room outline -->
  <rect x="60" y="70" width="520" height="320" rx="6" fill="#fff" stroke="#3d405b" stroke-width="3"/>
  <!-- scale tick -->
  <line x1="60" y1="408" x2="580" y2="408" stroke="#3d405b" stroke-width="2"/>
  <text x="320" y="425" font-size="11" fill="#3d405b" text-anchor="middle">8m</text>
  <line x1="60" y1="402" x2="60" y2="414" stroke="#3d405b" stroke-width="2"/>
  <line x1="580" y1="402" x2="580" y2="414" stroke="#3d405b" stroke-width="2"/>

  <!-- entry (right-top) warm light -->
  <rect x="540" y="80" width="40" height="40" rx="4" fill="#e9c46a" stroke="#e07a5f" stroke-width="2"/>
  <text x="560" y="104" font-size="10" fill="#3d405b" text-anchor="middle">门口</text>
  <circle cx="560" cy="78" r="14" fill="#f2cc8f" opacity="0.5"/>
  <text x="560" y="62" font-size="10" fill="#e07a5f" text-anchor="middle">暖光出口</text>

  <!-- key object 1: 打包纸箱 (left, bright) -->
  <rect x="95" y="110" width="80" height="60" rx="4" fill="#e9c46a" stroke="#e07a5f" stroke-width="2"/>
  <text x="135" y="142" font-size="11" fill="#3d405b" text-anchor="middle">打包纸箱</text>
  <text x="135" y="158" font-size="9" fill="#3d405b" text-anchor="middle">（核心）</text>

  <!-- key object 2: 书桌 (center, bright) -->
  <rect x="275" y="140" width="130" height="50" rx="4" fill="#e9c46a" stroke="#e07a5f" stroke-width="2"/>
  <text x="340" y="168" font-size="11" fill="#3d405b" text-anchor="middle">书桌（清空）</text>

  <!-- 衣柜 (left wall, 2m, top相框) -->
  <rect x="95" y="230" width="70" height="120" rx="4" fill="#3d405b" opacity="0.85"/>
  <text x="130" y="295" font-size="10" fill="#f4f1de" text-anchor="middle">衣柜</text>
  <!-- 柜顶相框 (optional, on top) -->
  <rect x="108" y="214" width="44" height="14" rx="2" fill="#81b29a" stroke="#2d7d8a" stroke-width="1.5"/>
  <text x="130" y="209" font-size="9" fill="#2d7d8a" text-anchor="middle">相框(可选)</text>

  <!-- 木椅 (beside衣柜) -->
  <rect x="185" y="300" width="38" height="38" rx="3" fill="#a8dadc" stroke="#2d7d8a" stroke-width="2"/>
  <text x="204" y="323" font-size="9" fill="#3d405b" text-anchor="middle">木椅</text>
  <line x1="204" y1="280" x2="204" y2="300" stroke="#2d7d8a" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="285" y="316" font-size="9" fill="#2d7d8a" text-anchor="middle">站上→柜顶</text>

  <!-- key object 3: 行李箱 (right, bright) -->
  <rect x="440" y="240" width="90" height="60" rx="4" fill="#e9c46a" stroke="#e07a5f" stroke-width="2"/>
  <text x="485" y="272" font-size="11" fill="#3d405b" text-anchor="middle">行李箱</text>
  <text x="485" y="288" font-size="9" fill="#3d405b" text-anchor="middle">（核心）</text>

  <!-- 床 (right wall, 耳机 under) -->
  <rect x="430" y="320" width="110" height="48" rx="4" fill="#2d7d8a" opacity="0.8"/>
  <text x="485" y="347" font-size="10" fill="#f4f1de" text-anchor="middle">床</text>
  <!-- 耳机 (optional under bed) -->
  <circle cx="445" cy="352" r="7" fill="#81b29a" stroke="#2d7d8a" stroke-width="1.5"/>
  <text x="370" y="372" font-size="9" fill="#2d7d8a" text-anchor="middle">耳机(可选·床底)</text>

  <!-- legend -->
  <g font-size="10" fill="#3d405b">
    <rect x="620" y="80" width="14" height="14" fill="#e9c46a" stroke="#e07a5f" stroke-width="1.5"/><text x="640" y="92">核心物件</text>
    <rect x="620" y="104" width="14" height="14" fill="#81b29a" stroke="#2d7d8a" stroke-width="1.5"/><text x="640" y="116">可选记忆碎片</text>
    <rect x="620" y="128" width="14" height="14" fill="#a8dadc" stroke="#2d7d8a" stroke-width="1.5"/><text x="640" y="140">辅助道具</text>
    <rect x="620" y="152" width="14" height="14" fill="#e9c46a"/><text x="640" y="164">出口暖光</text>
  </g>

  <!-- player start -->
  <circle cx="300" cy="350" r="10" fill="#e07a5f" stroke="#3d405b" stroke-width="2"/>
  <text x="300" y="385" font-size="9" fill="#e07a5f" text-anchor="middle">女儿起点</text>
</svg>
