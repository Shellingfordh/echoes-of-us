<svg viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3d405b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="500" fill="#f4f1de"/>

  <text x="340" y="30" font-size="20" font-weight="700" fill="#3d405b" text-anchor="middle">Act 2｜街道分阶段教学（P002）</text>
  <text x="340" y="50" font-size="12" fill="#3d405b" opacity="0.7" text-anchor="middle">认知负荷由低到高：先单独操作，再引入小女儿与牵挂线</text>

  <!-- ground line -->
  <line x1="40" y1="400" x2="640" y2="400" stroke="#3d405b" stroke-width="3"/>
  <text x="340" y="425" font-size="11" fill="#3d405b" text-anchor="middle">街道地面 → 出口在右侧</text>

  <!-- Stage A: 推自行车 -->
  <g>
    <circle cx="90" cy="375" r="16" fill="#e07a5f" stroke="#3d405b" stroke-width="2"/>
    <text x="90" y="379" font-size="10" fill="#f4f1de" text-anchor="middle">母</text>
    <rect x="120" y="360" width="60" height="28" rx="4" fill="#2d7d8a" stroke="#3d405b" stroke-width="1.5"/>
    <circle cx="135" cy="392" r="7" fill="#3d405b"/><circle cx="165" cy="392" r="7" fill="#3d405b"/>
    <text x="150" y="345" font-size="11" font-weight="700" fill="#3d405b" text-anchor="middle">A. 推自行车</text>
    <text x="150" y="332" font-size="9" fill="#3d405b" text-anchor="middle">单向平台 · 无干扰</text>
    <line x1="180" y1="360" x2="240" y2="360" stroke="#3d405b" stroke-width="2" marker-end="url(#arr3)"/>
  </g>

  <!-- Stage B: 水坑 -->
  <g>
    <rect x="250" y="384" width="70" height="16" rx="3" fill="#81b29a" stroke="#2d7d8a" stroke-width="1.5"/>
    <text x="285" y="378" font-size="9" fill="#2d7d8a" text-anchor="middle">水坑</text>
    <circle cx="330" cy="375" r="16" fill="#e07a5f" stroke="#3d405b" stroke-width="2"/>
    <text x="330" y="379" font-size="10" fill="#f4f1de" text-anchor="middle">母</text>
    <!-- small daughter + taut line -->
    <circle cx="360" cy="375" r="12" fill="#f2cc8f" stroke="#e07a5f" stroke-width="2"/>
    <text x="360" y="379" font-size="9" fill="#3d405b" text-anchor="middle">女</text>
    <line x1="346" y1="370" x2="354" y2="370" stroke="#e07a5f" stroke-width="3"/>
    <text x="330" y="340" font-size="11" font-weight="700" fill="#3d405b" text-anchor="middle">B. 水坑</text>
    <text x="330" y="327" font-size="9" fill="#3d405b" text-anchor="middle">线张力教学</text>
    <line x1="372" y1="360" x2="432" y2="360" stroke="#3d405b" stroke-width="2" marker-end="url(#arr3)"/>
  </g>

  <!-- Stage C: 快递柜缺口 + 角色切换 -->
  <g>
    <rect x="440" y="330" width="34" height="70" rx="3" fill="#3d405b"/>
    <text x="457" y="370" font-size="9" fill="#f4f1de" text-anchor="middle">柜</text>
    <rect x="474" y="345" width="34" height="55" rx="3" fill="#3d405b" opacity="0.7"/>
    <text x="491" y="375" font-size="9" fill="#f4f1de" text-anchor="middle">缺</text>
    <circle cx="455" cy="375" r="14" fill="#e07a5f" stroke="#3d405b" stroke-width="2"/>
    <text x="455" y="379" font-size="9" fill="#f4f1de" text-anchor="middle">母</text>
    <!-- Tab switch indicator -->
    <rect x="430" y="300" width="60" height="18" rx="4" fill="#e9c46a" stroke="#e07a5f" stroke-width="1.5"/>
    <text x="460" y="313" font-size="9" fill="#3d405b" text-anchor="middle">Tab 切换</text>
    <line x1="478" y1="300" x2="478" y2="350" stroke="#e07a5f" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="505" y="330" font-size="11" font-weight="700" fill="#3d405b" text-anchor="middle">C. 快递柜缺口</text>
    <text x="505" y="317" font-size="9" fill="#3d405b" text-anchor="middle">角色切换教学</text>
    <line x1="508" y1="360" x2="568" y2="360" stroke="#3d405b" stroke-width="2" marker-end="url(#arr3)"/>
  </g>

  <!-- Stage D: 路灯锚点 -->
  <g>
    <circle cx="600" cy="375" r="16" fill="#e07a5f" stroke="#3d405b" stroke-width="2"/>
    <text x="600" y="379" font-size="10" fill="#f4f1de" text-anchor="middle">母</text>
    <circle cx="600" cy="290" r="8" fill="#e9c46a" stroke="#e07a5f" stroke-width="2"/>
    <line x1="600" y1="298" x2="600" y2="359" stroke="#3d405b" stroke-width="2"/>
    <text x="600" y="280" font-size="9" fill="#3d405b" text-anchor="middle">路灯</text>
    <!-- anchor dashed preview -->
    <line x1="585" y1="370" x2="585" y2="300" stroke="#2d7d8a" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="600" y="330" font-size="11" font-weight="700" fill="#3d405b" text-anchor="middle">D. 路灯锚点</text>
    <text x="600" y="317" font-size="9" fill="#3d405b" text-anchor="middle">锚定借跳</text>
  </g>

  <!-- four-fold identity hint -->
  <rect x="40" y="445" width="600" height="40" rx="6" fill="#fff" stroke="#3d405b" stroke-width="1.5"/>
  <text x="60" y="470" font-size="11" font-weight="700" fill="#3d405b">角色切换四重标识：</text>
  <text x="200" y="470" font-size="10" fill="#3d405b">① 轮廓发光  ② 角色名高亮  ③ 屏幕边缘色光  ④ 相机轻微偏移</text>
</svg>
