name: Auto-approve and merge non-code PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write
  checks: read
  statuses: read

jobs:
  approve-and-merge:
    name: Auto-approve & merge non-code PRs
    runs-on: ubuntu-latest

    steps:
      - name: Auto-approve and merge when only approved non-code files changed
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const prNumber = context.issue.number

            // ============================================================
            // 1. Fetch all changed files
            // ============================================================

            let files = []
            let page = 1

            while (true) {
              const res = await github.rest.pulls.listFiles({
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100,
                page
              })

              files = files.concat(
                res.data.map(file => file.filename)
              )

              if (res.data.length < 100) {
                break
              }

              page++
            }

            core.info(
              `Files changed (${files.length}):\n${files.join('\n')}`
            )

            if (files.length === 0) {
              core.info('No changed files detected — skipping automation')
              return
            }

            // ============================================================
            // 2. Trust check
            //
            // Only repository owner, collaborators, or explicit allowlist
            // users are allowed to trigger auto-approve / auto-merge.
            // ============================================================

            const prData = (
              await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber
              })
            ).data

            const author = prData.user.login
            const ownerLogin = context.repo.owner

            // Explicit users that are always trusted.
            const allowlist = [
              'Shellingfordh'
            ]

            let trusted = false

            // Repository owner
            if (author === ownerLogin) {
              trusted = true
            }

            // Explicit allowlist
            if (allowlist.includes(author)) {
              trusted = true
            }

            // Repository collaborator
            if (!trusted) {
              try {
                await github.rest.repos.checkCollaborator({
                  owner,
                  repo,
                  username: author
                })

                trusted = true
              } catch (e) {
                trusted = false
              }
            }

            if (!trusted) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body:
                  '自动化仅限仓库 owner、collaborator 或白名单用户。' +
                  '此 PR 的作者未被信任，自动批准/合并已跳过。'
              })

              core.info(
                `Author "${author}" is not trusted — skipping automation`
              )

              return
            }

            core.info(
              `Author "${author}" is trusted — continuing`
            )

            // ============================================================
            // 3. Explicit non-code allowlist
            //
            // IMPORTANT:
            // Anything NOT explicitly allowed here is considered unsafe
            // and requires manual review.
            //
            // This is intentionally an allowlist rather than a blacklist.
            // ============================================================

            const safeExtensions = [
              // Documentation
              '.md',
              '.mdx',
              '.txt',

              // Office / operation documents
              '.doc',
              '.docx',
              '.xls',
              '.xlsx',
              '.csv',

              // Images / artwork
              '.png',
              '.jpg',
              '.jpeg',
              '.webp',
              '.gif',
              '.svg',
              '.ico',
              '.bmp',
              '.tiff',
              '.tif',

              // Video / media
              '.mp4',
              '.mov',
              '.webm',

              // Audio
              '.mp3',
              '.wav',
              '.ogg'
            ]

            // Exact filenames that are explicitly considered safe.
            const safeExactFiles = [
              'README',
              'README.md',
              'README.txt',
              'LICENSE',
              'LICENSE.md',
              'LICENSE.txt',
              'NOTICE',
              'NOTICE.md',
              'CHANGELOG.md'
            ]

            // Optional safe directories.
            //
            // These directories are still restricted by extension:
            // a file inside these directories is safe ONLY if its extension
            // is also in safeExtensions.
            const safeDirectories = [
              'docs/',
              'documentation/',
              '运营/',
              '运营文档/',
              'content/',
              'game/assets/',
              'images/',
              'image/',
              'art/',
              'artwork/',
              'media/',
              'design/'
            ]

            function normalizePath(filename) {
              return filename
                .replace(/\\/g, '/')
                .replace(/^\.\/+/, '')
            }

            function isSafeNonCodeFile(filename) {
              const normalized = normalizePath(filename)
              const lower = normalized.toLowerCase()

              // ----------------------------------------------------------
              // Exact safe files
              // ----------------------------------------------------------

              if (
                safeExactFiles.some(
                  file => lower === file.toLowerCase()
                )
              ) {
                return true
              }

              // ----------------------------------------------------------
              // Safe extensions
              //
              // This works with:
              //
              // docs/运营文档（1）.md
              // docs/运营 文档 2.xlsx
              // game/assets/角色立绘（最终版）.png
              //
              // Chinese characters, spaces and brackets are fine.
              // ----------------------------------------------------------

              const hasSafeExtension = safeExtensions.some(
                ext => lower.endsWith(ext)
              )

              if (!hasSafeExtension) {
                return false
              }

              // ----------------------------------------------------------
              // If the file is inside a safe directory, allow it.
              //
              // Files with safe extensions are also allowed outside these
              // directories, so this check is intentionally permissive.
              // ----------------------------------------------------------

              const inSafeDirectory = safeDirectories.some(
                dir => lower.startsWith(dir.toLowerCase())
              )

              if (inSafeDirectory) {
                return true
              }

              // Safe extension is enough even outside the directories.
              return true
            }

            // ============================================================
            // 4. Check every changed file
            // ============================================================

            const unsafeFiles = files.filter(
              file => !isSafeNonCodeFile(file)
            )

            if (unsafeFiles.length > 0) {
              core.info(
                'Files outside the non-code allowlist were detected. ' +
                'Auto-approve and auto-merge will NOT run.'
              )

              core.info(
                `Unsafe files:\n${unsafeFiles.join('\n')}`
              )

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body:
                  '检测到需要人工审核的文件，因此不会自动批准或合并此 PR。\n\n' +
                  '需要人工审核的文件：\n' +
                  unsafeFiles.map(file => `- \`${file}\``).join('\n')
              })

              return
            }

            // ============================================================
            // 5. All files passed the non-code allowlist
            // ============================================================

            core.info(
              'All changed files are explicitly allowed non-code files.'
            )

            core.info(
              `Safe files:\n${files.join('\n')}`
            )

            // ============================================================
            // 6. Approve the PR
            // ============================================================

            try {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: prNumber,
                event: 'APPROVE',
                body:
                  'Auto-approved: approved non-code changes only ✅\n\n' +
                  '此 PR 仅包含允许自动处理的文档、运营资料或媒体资源。'
              })

              core.info('PR approved successfully')
            } catch (err) {
              core.error(
                `Failed to approve PR: ${err.message}`
              )

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body:
                  `自动批准失败：${err.message}\n\n` +
                  'PR 将保留为人工处理。'
              })

              return
            }

            // ============================================================
            // 7. Get current PR HEAD SHA
            // ============================================================

            const currentPr = (
              await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber
              })
            ).data

            const headSha = currentPr.head.sha

            core.info(
              `Current PR HEAD SHA: ${headSha}`
            )

            // ============================================================
            // 8. Poll GitHub checks
            //
            // Wait for checks to finish.
            //
            // If there are no checks at all, the PR can proceed.
            // ============================================================

            const maxAttempts = 48
            const delayMs = 5000

            let ready = false

            for (let i = 0; i < maxAttempts; i++) {

              // ----------------------------------------------------------
              // Combined commit status
              // ----------------------------------------------------------

              const combined =
                await github.rest.repos.getCombinedStatusForRef({
                  owner,
                  repo,
                  ref: headSha
                })

              const state = combined.data.state

              // ----------------------------------------------------------
              // GitHub check runs
              // ----------------------------------------------------------

              const checks =
                await github.rest.checks.listForRef({
                  owner,
                  repo,
                  ref: headSha
                })

              const runs = checks.data.check_runs || []

              core.info(
                `Attempt ${i + 1}: ` +
                `combined state=${state}, ` +
                `check_runs=${runs.length}`
              )

              // ----------------------------------------------------------
              // Check for failures
              // ----------------------------------------------------------

              const anyFailures =
                state === 'failure' ||
                runs.some(run =>
                  ['failure', 'cancelled', 'timed_out', 'action_required']
                    .includes(run.conclusion)
                )

              if (anyFailures) {

                core.info(
                  'Detected failing checks — automatic merge cancelled'
                )

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body:
                    '自动批准已完成，但 CI / checks 存在失败，因此不会自动合并。'
                })

                return
              }

              // ----------------------------------------------------------
              // Check whether all runs completed successfully
              // ----------------------------------------------------------

              const runsAllPassed =
                runs.length === 0 ||
                runs.every(run =>
                  ['success', 'neutral', 'skipped'].includes(
                    run.conclusion
                  )
                )

              if (
                (state === 'success' || runs.length === 0) &&
                runsAllPassed
              ) {
                ready = true
                break
              }

              // ----------------------------------------------------------
              // Still pending — wait
              // ----------------------------------------------------------

              await new Promise(
                resolve => setTimeout(resolve, delayMs)
              )
            }

            // ============================================================
            // 9. Checks did not finish within timeout
            // ============================================================

            if (!ready) {

              core.info(
                'Checks did not become ready in time — leaving PR for manual merge'
              )

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body:
                  '自动批准已完成，但 checks 未在规定时间内完成。' +
                  'PR 将保留，请等待 checks 完成后手动合并。'
              })

              return
            }

            // ============================================================
            // 10. Final merge
            // ============================================================

            try {

              // Refresh PR immediately before merge.
              const latestPr =
                (
                  await github.rest.pulls.get({
                    owner,
                    repo,
                    pull_number: prNumber
                  })
                ).data

              // Make sure PR is still open.
              if (latestPr.state !== 'open') {

                core.info(
                  `PR is no longer open: ${latestPr.state}`
                )

                return
              }

              // Make sure the head SHA has not changed while we waited.
              if (latestPr.head.sha !== headSha) {

                core.info(
                  'PR HEAD changed while waiting — refusing to merge stale commit'
                )

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body:
                    'PR 在自动合并等待期间发生了新的提交。' +
                    '为避免合并旧版本，自动合并已取消，请重新触发 workflow。'
                })

                return
              }

              const mergeRes =
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: prNumber,
                  sha: headSha,
                  commit_title:
                    `Merge pull request #${prNumber}: non-code changes`,
                  merge_method: 'merge'
                })

              if (mergeRes.data.merged) {

                core.info(
                  `PR merged successfully: ${mergeRes.data.sha}`
                )

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body:
                    `Auto-merge completed ✅\n\n` +
                    `Merge SHA: \`${mergeRes.data.sha}\``
                })

              } else {

                core.info(
                  'Merge attempt did not merge the PR: ' +
                  JSON.stringify(mergeRes.data)
                )

                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body:
                    '自动批准成功，但自动合并未完成。' +
                    '请检查 branch protection / ruleset / merge requirements 后手动合并。'
                })
              }

            } catch (err) {

              core.error(
                `Merge failed: ${err.message}`
              )

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body:
                  `自动批准成功，但自动合并失败：\n\n` +
                  `\`${err.message}\`\n\n` +
                  '请检查 Ruleset、branch protection、checks 和 GitHub Actions 权限。'
              })
            }
