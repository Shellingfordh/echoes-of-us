name: Auto-approve non-code PRs

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write

jobs:
  auto-approve-non-code:
    name: Auto-approve non-code PRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44

      - name: Check if only non-code files changed
        id: check
        run: |
          files="${{ steps.changed-files.outputs.all_changed_files }}"
          
          # Define code file extensions/patterns
          has_code=false
          
          for file in $files; do
            # Skip certain directories/files
            if [[ "$file" == ".github/workflows"* ]]; then
              has_code=true
              break
            fi
            
            # Check code file extensions
            case "$file" in
              *.gd|*.gdshader|*.gdscript|\
              *.cs|*.java|*.py|*.js|*.ts|*.tsx|*.jsx|\
              *.cpp|*.c|*.h|*.hpp|*.cc|*.cxx|\
              *.rb|*.go|*.rs|*.php|*.swift|*.kt|\
              *.lua|*.vim|*.pl|*.sh|*.bash|\
              *.json|*.yaml|*.yml|*.toml|*.xml|*.config|*.conf|\
              *.gitignore|project.godot|*.tscn|*.tres)
                has_code=true
                break
                ;;
            esac
          done
          
          if [ "$has_code" = "false" ]; then
            echo "only_non_code=true" >> $GITHUB_OUTPUT
          else
            echo "only_non_code=false" >> $GITHUB_OUTPUT
          fi

      - name: Auto approve PR
        if: steps.check.outputs.only_non_code == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: 'APPROVE',
              body: 'Auto-approved: Non-code changes only ✅\n\n只包含文档、资源等非代码文件的修改'
            })
