name: Auto-approve markdown PRs

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write

jobs:
  auto-approve-docs:
    name: Auto-approve markdown PRs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **.md

      - name: Check if only markdown files changed
        id: check
        run: |
          if [ "${{ steps.changed-files.outputs.any_modified }}" = "true" ]; then
            echo "has_md_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_md_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Auto approve PR
        if: steps.check.outputs.has_md_changes == 'true'
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: 'APPROVE',
              body: 'Auto-approved: Markdown files only ✅'
            })
