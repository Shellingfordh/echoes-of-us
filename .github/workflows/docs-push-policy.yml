name: Auto-approve and merge non-code PRs

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read
  checks: read
  statuses: read

jobs:
  approve-and-merge:
    name: Auto-approve & merge non-code PRs
    runs-on: ubuntu-latest
    steps:
      - name: Auto-approve and merge when only non-code files changed
        uses: actions/github-script@v6
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const prNumber = context.issue.number

            // Fetch PR files (handle pagination)
            let files = []
            let page = 1
            while (true) {
              const res = await github.rest.pulls.listFiles({ owner, repo, pull_number: prNumber, per_page: 100, page })
              files = files.concat(res.data.map(f => f.filename))
              if (res.data.length < 100) break
              page++
            }

            core.info(`Files changed (${files.length}):\n${files.join('\n')}`)

            // --- Trust check: only allow automation for repository collaborators or explicit allowlist ---
            const prData = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data
            const author = prData.user.login
            const ownerLogin = context.repo.owner
            const allowlist = ['Shellingfordh']

            let trusted = false
            if (author === ownerLogin || allowlist.includes(author)) {
              trusted = true
            } else {
              try {
                await github.rest.repos.checkCollaborator({ owner, repo, username: author })
                trusted = true
              } catch (e) {
                trusted = false
              }
            }

            if (!trusted) {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body: '自动化仅限仓库的 collaborator 或白名单用户。此 PR 的作者未被信任，自动批准/合并已跳过。' })
              core.info('Author not trusted — skipping automation')
              return
            }
            // --- End trust check ---

            // Define code file patterns or directories that count as code
            const codePatterns = [
              '.github/workflows',
              'scripts/',
              'scenes/',
              'src/',
              'project.godot'
            ]

            const codeExts = [
              '.gd', '.gdscript', '.gdshader', '.cs', '.java', '.py', '.js', '.ts', '.tsx', '.jsx',
              '.cpp', '.c', '.h', '.hpp', '.cc', '.cxx', '.rb', '.go', '.rs', '.php', '.swift', '.kt',
              '.lua', '.pl', '.sh', '.bash', '.json', '.yaml', '.yml', '.toml', '.xml', '.config', '.conf',
              '.gitignore', '.tscn', '.tres'
            ]

            function isCodeFile(filename) {
              const lower = filename.toLowerCase()
              for (const p of codePatterns) {
                if (filename.startsWith(p) || filename.includes(p)) return true
              }
              for (const ext of codeExts) {
                if (lower.endsWith(ext)) return true
              }
              return false
            }

            const codeFiles = files.filter(isCodeFile)
            if (codeFiles.length > 0) {
              core.info('Detected code files in PR — skipping auto-approve/merge:\n' + codeFiles.join('\n'))
              return
            }

            // Approve the PR
            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number: prNumber,
              event: 'APPROVE',
              body: 'Auto-approved: non-code changes only ✅'
            })
            core.info('PR approved')

            // Get PR to find head SHA
            const pr = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data
            const headSha = pr.head.sha

            // Poll for status/checks to succeed
            const maxAttempts = 48 // total wait up to ~4 minutes (48 * 5s)
            const delayMs = 5000
            let ready = false
            for (let i = 0; i < maxAttempts; i++) {
              // Check combined status
              const combined = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: headSha })
              const state = combined.data.state // 'success', 'pending', 'failure'

              // Check check-runs
              const checks = await github.rest.checks.listForRef({ owner, repo, ref: headSha })
              const runs = checks.data.check_runs || []

              core.info(`Attempt ${i+1}: combined state=${state}, check_runs=${runs.length}`)

              // Decide readiness: combined state success AND (no runs OR all runs are successful/neutral/skipped)
              const runsAllPassed = runs.length === 0 || runs.every(r => ['success','neutral','skipped'].includes(r.conclusion))
              if (state === 'success' && runsAllPassed) {
                ready = true
                break
              }

              // If any runs have failure or combined state is failure, abort
              const anyFailures = runs.some(r => r.conclusion === 'failure') || state === 'failure'
              if (anyFailures) {
                core.info('Detected failing checks — will not merge automatically')
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body: 'Auto-approve succeeded but required checks are failing — please address CI failures before merging.' })
                return
              }

              // wait and retry
              await new Promise(r => setTimeout(r, delayMs))
            }

            if (!ready) {
              core.info('Checks did not become ready in time — leaving for manual merge')
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body: 'Auto-approve succeeded but checks did not finish in time — please wait or merge manually.' })
              return
            }

            // Attempt to merge
            try {
              const mergeRes = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: prNumber,
                commit_title: `Merge pull request #${prNumber} by automation: non-code changes`,
                merge_method: 'merge'
              })
              if (mergeRes.data.merged) {
                core.info(`PR merged by automation: ${mergeRes.data.sha}`)
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body: `Auto-merge completed ✅ (SHA: ${mergeRes.data.sha})` })
              } else {
                core.info('Merge attempt did not merge the PR: ' + JSON.stringify(mergeRes.data))
                await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body: 'Auto-approve succeeded but automatic merge could not complete — please merge manually.' })
              }
            } catch (err) {
              core.error('Merge failed: ' + err.message)
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body: `Auto-approve succeeded but automatic merge failed: ${err.message}` })
            }
