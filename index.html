<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Echoes of Us — 牵挂线</title>
  <meta
    name="description"
    content="Echoes of Us（牵挂线）是一款关于距离、牵挂与连接的叙事互动游戏。"
  >

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;500;600&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet"
  >

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body,
    #root {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: #050505;
      color: white;
      overflow-x: hidden;
    }

    button,
    a {
      -webkit-user-select: none;
      user-select: none;
    }

    /* --------------------------------
       Glass
    -------------------------------- */

    .glass {
      background: rgba(255, 255, 255, 0.055);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 12px 40px rgba(0, 0, 0, 0.18);
    }

    .glass:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.18);
    }

    /* --------------------------------
       Marquee
    -------------------------------- */

    @keyframes marquee {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    .marquee {
      width: max-content;
      animation: marquee 32s linear infinite;
    }

    /* --------------------------------
       Fade animations
    -------------------------------- */

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-up {
      animation: fadeUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .delay-1 {
      animation-delay: 0.15s;
      opacity: 0;
    }

    .delay-2 {
      animation-delay: 0.3s;
      opacity: 0;
    }

    .delay-3 {
      animation-delay: 0.45s;
      opacity: 0;
    }

    /* --------------------------------
       Floating line
    -------------------------------- */

    @keyframes pulseLine {
      0%,
      100% {
        opacity: 0.25;
      }

      50% {
        opacity: 0.7;
      }
    }

    .pulse-line {
      animation: pulseLine 3s ease-in-out infinite;
    }

    /* --------------------------------
       Scroll
    -------------------------------- */

    .scroll-area {
      scrollbar-width: none;
    }

    .scroll-area::-webkit-scrollbar {
      display: none;
    }

    /* --------------------------------
       Mobile
    -------------------------------- */

    @media (max-width: 640px) {
      .hero-title {
        font-size: 4.5rem !important;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">

    const { useState, useEffect, useRef } = React;

    /*
     * ==========================================
     * Game resources
     * ==========================================
     *
     * 你可以把这些 URL 换成 GitHub 仓库里的实际资源。
     */

    const BG_IMAGE =
      "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20260713_140344_79e1296a-86d7-43fd-9b5f-63ffe560f291.png&w=1600&q=90";

    const FRONT_VIDEO =
      "https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260713_162101_0d7498c5-29bb-47bf-a99f-2773c0a880a9.mp4";

    /*
     * GitHub
     */
    const GITHUB_REPO =
      "https://github.com/Shellingfordh/echoes-of-us";

    /*
     * 如果你以后创建 Release：
     *
     * https://github.com/Shellingfordh/echoes-of-us/releases
     *
     * 可以把下面的 DOWNLOAD_URL 改成具体 Release。
     */
    const DOWNLOAD_URL =
      "https://github.com/Shellingfordh/echoes-of-us/releases";

    /*
     * ==========================================
     * Story text
     * ==========================================
     */

    const STORY_QUOTES = [
      "有些距离，并不会让人真正分开。",
      "我们之间，总有一根看不见的线。",
      "它曾经像束缚，也曾经成为支撑。",
      "当距离越来越远，牵挂反而越来越清晰。",
      "站在线的另一端，她一直都在。"
    ];


    function App() {

      const [isMenuOpen, setIsMenuOpen] = useState(false);

      const [activeChar, setActiveChar] = useState("yunia");

      const [charPos, setCharPos] = useState({
        yunia: {
          x: 35,
          y: 50
        },

        mother: {
          x: 65,
          y: 50
        }
      });

      const [isAnchored, setIsAnchored] = useState(false);

      const mousePos = useRef({
        x: window.innerWidth / 2,
        y: window.innerHeight / 2
      });

      const smoothPos = useRef({
        x: window.innerWidth / 2,
        y: window.innerHeight / 2
      });

      const canvasRef = useRef(null);

      const [maskDataUrl, setMaskDataUrl] = useState("");

      /*
       * ------------------------------------------
       * Body scroll lock
       * ------------------------------------------
       */

      useEffect(() => {

        document.body.style.overflow =
          isMenuOpen ? "hidden" : "";

        return () => {
          document.body.style.overflow = "";
        };

      }, [isMenuOpen]);


      /*
       * ------------------------------------------
       * Mouse / spotlight
       * ------------------------------------------
       */

      useEffect(() => {

        const canvas = document.createElement("canvas");

        canvasRef.current = canvas;

        const ctx = canvas.getContext("2d");

        let animationFrame;

        const resize = () => {

          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;

        };

        resize();

        const handleMouseMove = (event) => {

          mousePos.current = {
            x: event.clientX,
            y: event.clientY
          };

        };

        const handleTouchMove = (event) => {

          if (!event.touches.length) return;

          mousePos.current = {
            x: event.touches[0].clientX,
            y: event.touches[0].clientY
          };

        };

        window.addEventListener(
          "mousemove",
          handleMouseMove
        );

        window.addEventListener(
          "touchmove",
          handleTouchMove,
          { passive: true }
        );

        window.addEventListener(
          "resize",
          resize
        );


        const render = () => {

          smoothPos.current.x +=
            (mousePos.current.x - smoothPos.current.x) * 0.08;

          smoothPos.current.y +=
            (mousePos.current.y - smoothPos.current.y) * 0.08;


          ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
          );


          const radius = 280;

          const gradient =
            ctx.createRadialGradient(
              smoothPos.current.x,
              smoothPos.current.y,
              0,

              smoothPos.current.x,
              smoothPos.current.y,
              radius
            );


          gradient.addColorStop(
            0,
            "rgba(255,255,255,0.85)"
          );

          gradient.addColorStop(
            0.35,
            "rgba(255,255,255,0.5)"
          );

          gradient.addColorStop(
            0.7,
            "rgba(255,255,255,0.12)"
          );

          gradient.addColorStop(
            1,
            "rgba(255,255,255,0)"
          );


          ctx.fillStyle = gradient;

          ctx.beginPath();

          ctx.arc(
            smoothPos.current.x,
            smoothPos.current.y,
            radius,
            0,
            Math.PI * 2
          );

          ctx.fill();


          try {
            setMaskDataUrl(canvas.toDataURL());
          } catch (error) {
            // ignore
          }


          animationFrame =
            requestAnimationFrame(render);

        };


        render();


        return () => {

          cancelAnimationFrame(animationFrame);

          window.removeEventListener(
            "mousemove",
            handleMouseMove
          );

          window.removeEventListener(
            "touchmove",
            handleTouchMove
          );

          window.removeEventListener(
            "resize",
            resize
          );

        };

      }, []);


      /*
       * ------------------------------------------
       * Tether calculation
       * ------------------------------------------
       */

      const distance = Math.abs(
        charPos.yunia.x -
        charPos.mother.x
      );


      /*
       * ------------------------------------------
       * Move character
       * ------------------------------------------
       */

      const handleMoveCharacter = (direction) => {

        const step = 4;

        const current =
          charPos[activeChar];

        let newX = current.x;


        if (direction === "left") {

          newX = Math.max(
            10,
            current.x - step
          );

        }

        if (direction === "right") {

          newX = Math.min(
            90,
            current.x + step
          );

        }


        const otherCharKey =
          activeChar === "yunia"
            ? "mother"
            : "yunia";

        const other =
          charPos[otherCharKey];


        const nextDistance =
          Math.abs(
            newX - other.x
          );


        /*
         * Tether reaction
         */

        if (
          nextDistance > 42 &&
          !isAnchored
        ) {

          setCharPos(prev => ({

            ...prev,

            [activeChar]: {
              ...prev[activeChar],
              x: newX
            },

            [otherCharKey]: {
              ...prev[otherCharKey],

              x:
                prev[otherCharKey].x +
                (
                  direction === "right"
                    ? 2
                    : -2
                )
            }

          }));

        } else {

          setCharPos(prev => ({

            ...prev,

            [activeChar]: {
              ...prev[activeChar],
              x: newX
            }

          }));

        }

      };


      /*
       * ------------------------------------------
       * Navigation
       * ------------------------------------------
       */

      const scrollTo = (id) => {

        setIsMenuOpen(false);

        const element =
          document.getElementById(id);

        if (element) {

          element.scrollIntoView({
            behavior: "smooth"
          });

        }

      };


      return (

        <div className="relative min-h-screen bg-[#050505] text-white">


          {/* ======================================
              Navigation
          ====================================== */}

          <nav
            className="
              fixed
              top-0
              left-0
              right-0
              z-50
              flex
              items-center
              justify-between
              px-6
              md:px-10
              py-5
            "
          >

            {/* Logo */}

            <button
              onClick={() => scrollTo("top")}
              className="
                flex
                items-center
                gap-3
                group
              "
            >

              <div
                className="
                  w-8
                  h-8
                  rounded-full
                  border
                  border-white/30
                  flex
                  items-center
                  justify-center
                  group-hover:border-white/70
                  transition
                "
              >

                <span
                  className="
                    w-2
                    h-2
                    rounded-full
                    bg-white
                  "
                />

              </div>

              <span
                className="
                  hidden
                  sm:block
                  text-xs
                  tracking-[0.28em]
                  uppercase
                  text-white/70
                "
              >
                Echoes of Us
              </span>

            </button>


            {/* Desktop navigation */}

            <div
              className="
                hidden
                md:flex
                items-center
                gap-2
                glass
                rounded-full
                px-2
                py-1.5
              "
            >

              <button
                onClick={() => scrollTo("game")}
                className="
                  px-4
                  py-2
                  rounded-full
                  text-sm
                  text-white/70
                  hover:text-white
                  hover:bg-white/10
                  transition
                "
              >
                游戏
              </button>


              <button
                onClick={() => scrollTo("story")}
                className="
                  px-4
                  py-2
                  rounded-full
                  text-sm
                  text-white/70
                  hover:text-white
                  hover:bg-white/10
                  transition
                "
              >
                故事
              </button>


              <button
                onClick={() => scrollTo("download")}
                className="
                  px-4
                  py-2
                  rounded-full
                  text-sm
                  text-white
                  bg-white/10
                  hover:bg-white/20
                  transition
                "
              >
                下载
              </button>

            </div>


            {/* GitHub */}

            <a
              href={GITHUB_REPO}
              target="_blank"
              rel="noopener noreferrer"
              className="
                hidden
                sm:flex
                glass
                rounded-full
                px-5
                py-2.5
                text-sm
                text-white/80
                hover:text-white
                transition
                items-center
                gap-2
              "
            >

              <svg
                className="w-4 h-4"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.15c-3.2.7-3.87-1.54-3.87-1.54-.53-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.67 1.25 3.32.96.1-.74.4-1.25.73-1.54-2.55-.29-5.23-1.27-5.23-5.66 0-1.25.45-2.27 1.18-3.07-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.15 1.17a10.94 10.94 0 0 1 5.74 0c2.19-1.48 3.15-1.17 3.15-1.17.62 1.58.23 2.75.11 3.04.73.8 1.18 1.82 1.18 3.07 0 4.4-2.69 5.36-5.25 5.64.41.36.78 1.08.78 2.18v3.23c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
              </svg>

              GitHub

            </a>


            {/* Mobile menu */}

            <button
              onClick={() => setIsMenuOpen(true)}
              className="
                md:hidden
                glass
                w-11
                h-11
                rounded-full
                flex
                flex-col
                justify-center
                items-center
                gap-1.5
              "
            >

              <span
                className="
                  w-5
                  h-px
                  bg-white
                "
              />

              <span
                className="
                  w-3.5
                  h-px
                  bg-white
                "
              />

            </button>

          </nav>


          {/* ======================================
              Mobile menu
          ====================================== */}

          {isMenuOpen && (

            <div
              className="
                fixed
                inset-0
                z-[60]
                bg-[#050505]
                flex
                flex-col
                justify-between
                p-8
              "
            >

              <div className="flex justify-end">

                <button
                  onClick={() => setIsMenuOpen(false)}
                  className="
                    glass
                    w-11
                    h-11
                    rounded-full
                    flex
                    items-center
                    justify-center
                  "
                >

                  <span
                    className="
                      absolute
                      w-5
                      h-px
                      bg-white
                      rotate-45
                    "
                  />

                  <span
                    className="
                      absolute
                      w-5
                      h-px
                      bg-white
                      -rotate-45
                    "
                  />

                </button>

              </div>


              <div
                className="
                  flex
                  flex-col
                  items-center
                  gap-8
                "
              >

                <button
                  onClick={() => scrollTo("game")}
                  className="
                    text-4xl
                    font-light
                  "
                >
                  游戏
                </button>

                <button
                  onClick={() => scrollTo("story")}
                  className="
                    text-4xl
                    font-light
                  "
                >
                  故事
                </button>

                <button
                  onClick={() => scrollTo("download")}
                  className="
                    text-4xl
                    font-light
                  "
                >
                  下载
                </button>

              </div>


              <div className="flex justify-center">

                <a
                  href={GITHUB_REPO}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="
                    glass
                    px-7
                    py-3
                    rounded-full
                  "
                >
                  GitHub
                </a>

              </div>

            </div>

          )}


          {/* ======================================
              HERO
          ====================================== */}

          <main id="top">

            <section
              id="game"
              className="
                relative
                h-screen
                min-h-[700px]
                overflow-hidden
                flex
                items-end
              "
            >

              {/* Background */}

              <div
                className="
                  absolute
                  inset-0
                  bg-cover
                  bg-center
                "
                style={{
                  backgroundImage:
                    `url(${BG_IMAGE})`
                }}
              />


              {/* Dark overlay */}

              <div
                className="
                  absolute
                  inset-0
                  bg-black/45
                "
              />


              {/* Gradient */}

              <div
                className="
                  absolute
                  inset-0
                  bg-gradient-to-t
                  from-black
                  via-black/30
                  to-black/20
                "
              />


              {/* Spotlight */}

              {maskDataUrl && (

                <div
                  className="
                    absolute
                    inset-0
                    pointer-events-none
                    opacity-70
                  "
                  style={{
                    WebkitMaskImage:
                      `url(${maskDataUrl})`,

                    maskImage:
                      `url(${maskDataUrl})`
                  }}
                >

                  <video
                    src={FRONT_VIDEO}
                    autoPlay
                    loop
                    muted
                    playsInline
                    className="
                      w-full
                      h-full
                      object-cover
                    "
                  />

                </div>

              )}


              {/* Hero content */}

              <div
                className="
                  relative
                  z-10
                  w-full
                  px-6
                  md:px-12
                  pb-12
                  md:pb-16
                "
              >

                <div
                  className="
                    max-w-6xl
                    mx-auto
                  "
                >

                  <div
                    className="
                      fade-up
                      flex
                      items-center
                      gap-3
                      mb-6
                    "
                  >

                    <span
                      className="
                        w-2
                        h-2
                        rounded-full
                        bg-white
                        pulse-line
                      "
                    />

                    <span
                      className="
                        text-xs
                        tracking-[0.3em]
                        uppercase
                        text-white/60
                      "
                    >
                      A narrative game
                    </span>

                  </div>


                  <h1
                    className="
                      hero-title
                      fade-up
                      text-[7rem]
                      sm:text-[9rem]
                      md:text-[12rem]
                      leading-[0.72]
                      tracking-[-0.045em]
                      font-normal
                      mb-8
                    "
                    style={{
                      fontFamily:
                        "'Instrument Serif', serif"
                    }}
                  >
                    Echoes
                  </h1>


                  <div
                    className="
                      fade-up
                      delay-1
                      flex
                      flex-col
                      md:flex-row
                      md:items-end
                      justify-between
                      gap-8
                    "
                  >

                    <div>

                      <div
                        className="
                          text-2xl
                          md:text-3xl
                          font-light
                          tracking-wide
                          mb-3
                        "
                      >
                        牵挂线
                      </div>

                      <p
                        className="
                          max-w-xl
                          text-sm
                          md:text-base
                          leading-7
                          text-white/65
                          font-light
                        "
                      >
                        一场关于距离、连接与牵挂的互动旅程。
                        当两个人被一根看不见的线连接，
                        你会如何选择前进，又会如何选择留下？
                      </p>

                    </div>


                    <a
                      href="#download"
                      className="
                        glass
                        shrink-0
                        rounded-full
                        px-7
                        py-3.5
                        flex
                        items-center
                        justify-center
                        gap-3
                        text-sm
                        hover:bg-white/15
                        transition
                      "
                    >

                      开始游戏

                      <svg
                        className="w-4 h-4"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        strokeWidth="1.5"
                      >
                        <path
                          d="M5 12h14M13 6l6 6-6 6"
                        />
                      </svg>

                    </a>

                  </div>

                </div>

              </div>

            </section>


            {/* ======================================
                STORY
            ====================================== */}

            <section
              id="story"
              className="
                relative
                py-24
                md:py-36
                overflow-hidden
              "
            >

              <div
                className="
                  max-w-6xl
                  mx-auto
                  px-6
                  md:px-12
                "
              >

                <div
                  className="
                    grid
                    md:grid-cols-2
                    gap-16
                    md:gap-24
                    items-start
                  "
                >

                  <div>

                    <span
                      className="
                        text-xs
                        tracking-[0.3em]
                        uppercase
                        text-white/40
                      "
                    >
                      The connection
                    </span>

                    <h2
                      className="
                        mt-5
                        text-5xl
                        md:text-7xl
                        font-light
                        tracking-tight
                      "
                    >
                      有些线，
                      <br />
                      <span
                        className="
                          text-white/45
                        "
                      >
                        看不见。
                      </span>
                    </h2>

                  </div>


                  <div
                    className="
                      space-y-8
                      text-white/65
                      font-light
                      leading-8
                    "
                  >

                    <p>
                      余念离开熟悉的地方，
                      开始独自面对一段新的旅程。
                    </p>

                    <p>
                      她很快发现，
                      自己与母亲之间始终存在着一条特殊的连接。
                      它无法被看见，却会随着距离发生变化。
                    </p>

                    <p>
                      玩家需要在两个角色之间切换，
                      感受这条线带来的束缚、拉扯与支撑。
                    </p>

                    <p
                      className="
                        text-white
                        text-lg
                      "
                    >
                      你越想走远，
                      它就越提醒你——
                      <br />
                      有些关系从来没有真正离开。
                    </p>

                  </div>

                </div>

              </div>

            </section>


            {/* ======================================
                MARQUEE
            ====================================== */}

            <section
              className="
                border-y
                border-white/10
                overflow-hidden
                py-5
              "
            >

              <div className="marquee flex">

                {[...STORY_QUOTES, ...STORY_QUOTES].map(
                  (text, index) => (

                    <div
                      key={index}
                      className="
                        flex
                        items-center
                        gap-8
                        px-8
                        whitespace-nowrap
                      "
                    >

                      <span
                        className="
                          text-sm
                          md:text-base
                          text-white/55
                          font-light
                        "
                      >
                        {text}
                      </span>

                      <span
                        className="
                          w-1
                          h-1
                          rounded-full
                          bg-white/30
                        "
                      />

                    </div>

                  )
                )}

              </div>

            </section>


            {/* ======================================
                INTERACTION
            ====================================== */}

            <section
              className="
                py-24
                md:py-36
              "
            >

              <div
                className="
                  max-w-5xl
                  mx-auto
                  px-6
                "
              >

                <div className="text-center mb-12">

                  <span
                    className="
                      text-xs
                      tracking-[0.3em]
                      uppercase
                      text-white/40
                    "
                  >
                    The tether
                  </span>

                  <h2
                    className="
                      mt-4
                      text-4xl
                      md:text-6xl
                      font-light
                    "
                  >
                    牵挂，是束缚还是支撑？
                  </h2>

                  <p
                    className="
                      mt-5
                      text-sm
                      text-white/45
                    "
                  >
                    点击角色并尝试移动，感受两人之间的距离。
                  </p>

                </div>


                {/* Interaction board */}

                <div
                  className="
                    glass
                    relative
                    h-48
                    md:h-56
                    rounded-3xl
                    overflow-hidden
                  "
                >

                  {/* Grid */}

                  <div
                    className="
                      absolute
                      inset-0
                      opacity-10
                    "
                    style={{
                      backgroundImage:
                        "linear-gradient(rgba(255,255,255,.5) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.5) 1px, transparent 1px)",
                      backgroundSize: "40px 40px"
                    }}
                  />


                  {/* Tether */}

                  <svg
                    className="
                      absolute
                      inset-0
                      w-full
                      h-full
                    "
                    preserveAspectRatio="none"
                  >

                    <line
                      x1={`${charPos.yunia.x}%`}
                      y1="50%"
                      x2={`${charPos.mother.x}%`}
                      y2="50%"
                      stroke={
                        distance > 38
                          ? "#ef4444"
                          : "#ffffff"
                      }
                      strokeOpacity="0.8"
                      strokeWidth="2"
                      strokeDasharray={
                        isAnchored
                          ? "6 5"
                          : "none"
                      }
                    />

                  </svg>


                  {/* YUNIA */}

                  <button
                    onClick={() =>
                      setActiveChar("yunia")
                    }
                    className="
                      absolute
                      top-1/2
                      -translate-x-1/2
                      -translate-y-1/2
                      transition-all
                      duration-200
                    "
                    style={{
                      left:
                        `${charPos.yunia.x}%`
                    }}
                  >

                    <div
                      className={`
                        w-16
                        h-16
                        rounded-full
                        flex
                        items-center
                        justify-center
                        border
                        ${
                          activeChar === "yunia"
                            ? "bg-white text-black border-white"
                            : "bg-black/40 text-white/70 border-white/30"
                        }
                      `}
                    >
                      余念
                    </div>

                  </button>


                  {/* MOTHER */}

                  <button
                    onClick={() =>
                      setActiveChar("mother")
                    }
                    className="
                      absolute
                      top-1/2
                      -translate-x-1/2
                      -translate-y-1/2
                      transition-all
                      duration-200
                    "
                    style={{
                      left:
                        `${charPos.mother.x}%`
                    }}
                  >

                    <div
                      className={`
                        w-16
                        h-16
                        rounded-full
                        flex
                        items-center
                        justify-center
                        border
                        ${
                          activeChar === "mother"
                            ? "bg-white text-black border-white"
                            : "bg-black/40 text-white/70 border-white/30"
                        }
                      `}
                    >
                      母亲
                    </div>

                  </button>

                </div>


                {/* Controls */}

                <div
                  className="
                    mt-5
                    flex
                    flex-wrap
                    items-center
                    justify-center
                    gap-3
                  "
                >

                  <button
                    onClick={() =>
                      handleMoveCharacter("left")
                    }
                    className="
                      glass
                      rounded-full
                      px-5
                      py-2.5
                      text-sm
                      text-white/70
                      hover:text-white
                      transition
                    "
                  >
                    ← 向左
                  </button>


                  <button
                    onClick={() =>
                      handleMoveCharacter("right")
                    }
                    className="
                      glass
                      rounded-full
                      px-5
                      py-2.5
                      text-sm
                      text-white/70
                      hover:text-white
                      transition
                    "
                  >
                    向右 →
                  </button>


                  <button
                    onClick={() =>
                      setIsAnchored(
                        !isAnchored
                      )
                    }
                    className={`
                      rounded-full
                      px-5
                      py-2.5
                      text-sm
                      transition
                      ${
                        isAnchored
                          ? "bg-white text-black"
                          : "glass text-white/70"
                      }
                    `}
                  >
                    {isAnchored
                      ? "已锚定"
                      : "锚定支撑"}
                  </button>

                </div>

              </div>

            </section>


            {/* ======================================
                DOWNLOAD
            ====================================== */}

            <section
              id="download"
              className="
                relative
                py-28
                md:py-40
                border-t
                border-white/10
              "
            >

              <div
                className="
                  max-w-5xl
                  mx-auto
                  px-6
                  text-center
                "
              >

                <span
                  className="
                    text-xs
                    tracking-[0.3em]
                    uppercase
                    text-white/40
                  "
                >
                  Download
                </span>


                <h2
                  className="
                    mt-5
                    text-5xl
                    md:text-8xl
                    font-light
                    tracking-tight
                  "
                >
                  Ready to connect?
                </h2>


                <p
                  className="
                    mt-6
                    max-w-xl
                    mx-auto
                    text-sm
                    md:text-base
                    text-white/50
                    leading-7
                  "
                >
                  下载 Echoes of Us Demo，
                  进入这段关于距离与牵挂的旅程。
                </p>


                {/* Download buttons */}

                <div
                  className="
                    mt-10
                    flex
                    flex-col
                    sm:flex-row
                    items-center
                    justify-center
                    gap-3
                  "
                >

                  <a
                    href={DOWNLOAD_URL}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="
                      w-full
                      sm:w-auto
                      min-w-52
                      rounded-full
                      bg-white
                      text-black
                      px-8
                      py-4
                      text-sm
                      font-medium
                      hover:bg-white/90
                      transition
                      flex
                      items-center
                      justify-center
                      gap-3
                    "
                  >

                    下载 Demo

                    <svg
                      className="w-4 h-4"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      strokeWidth="1.8"
                    >
                      <path d="M12 3v12" />
                      <path d="m7 10 5 5 5-5" />
                      <path d="M5 21h14" />
                    </svg>

                  </a>


                  <a
                    href={GITHUB_REPO}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="
                      w-full
                      sm:w-auto
                      min-w-52
                      glass
                      rounded-full
                      px-8
                      py-4
                      text-sm
                      text-white/80
                      hover:text-white
                      transition
                    "
                  >
                    查看 GitHub
                  </a>

                </div>


                <p
                  className="
                    mt-5
                    text-xs
                    text-white/30
                  "
                >
                  Demo · Early Development
                </p>

              </div>

            </section>


            {/* ======================================
                FOOTER
            ====================================== */}

            <footer
              className="
                border-t
                border-white/10
                px-6
                md:px-12
                py-8
              "
            >

              <div
                className="
                  max-w-6xl
                  mx-auto
                  flex
                  flex-col
                  sm:flex-row
                  items-center
                  justify-between
                  gap-4
                "
              >

                <div
                  className="
                    text-xs
                    tracking-[0.2em]
                    uppercase
                    text-white/40
                  "
                >
                  Echoes of Us · 牵挂线
                </div>


                <a
                  href={GITHUB_REPO}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="
                    text-xs
                    text-white/40
                    hover:text-white
                    transition
                  "
                >
                  GitHub
                </a>

              </div>

            </footer>

          </main>

        </div>
      );
    }


    ReactDOM
      .createRoot(
        document.getElementById("root")
      )
      .render(<App />);

  </script>
</body>
</html>
