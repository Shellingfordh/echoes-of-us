<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eee8dc">
  <title>不断线｜绘本记忆册版</title>
  <style>
    @font-face{font-family:noto;src:url('../game2.5d/art/fonts/NotoSansCJKsc-Regular.otf') format('opentype');font-display:swap}
    :root{--paper:#eee8dc;--paper-deep:#e4dac8;--ink:#272826;--muted:#6f706c;--red:#ad4e43;--yellow:#d0a44f;--blue:#7f9297;--photo:url('../game-chapter3/assets/environments/chapter3/stairwell/environment_ch03_stairwell_full_scene.png');--photo2:url('../game-chapter3/assets/environments/chapter3/rooftop/environment_ch03_rooftop_full_scene.png')}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:noto,'PingFang SC',sans-serif}
    button,a{font:inherit;color:inherit}button{cursor:pointer}
    .page{height:100%;position:relative;isolation:isolate;background:radial-gradient(circle at 73% 51%,rgba(255,255,255,.6),transparent 35%),linear-gradient(115deg,rgba(255,255,255,.4),transparent 48%),var(--paper)}
    .page:after{content:"";position:absolute;inset:0;z-index:20;pointer-events:none;opacity:.22;mix-blend-mode:multiply;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='p'%3E%3CfeTurbulence baseFrequency='.028' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23p)' opacity='.25'/%3E%3C/svg%3E")}
    header{height:86px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 clamp(26px,4.5vw,72px);position:relative;z-index:12}
    .brand{text-decoration:none;width:max-content}.brand strong{display:block;font:600 26px/1 'Songti SC',serif;letter-spacing:.18em}.brand small{display:block;margin-top:6px;font:400 8px/1 ui-monospace,monospace;letter-spacing:.34em}
    nav{display:flex;gap:clamp(26px,4vw,56px)}nav a{text-decoration:none;font-size:13px;letter-spacing:.14em;position:relative}nav a:after,.open-game:after{content:"";position:absolute;left:0;right:100%;bottom:-7px;height:1px;background:var(--ink);transition:right .3s}nav a:hover:after,.open-game:hover:after{right:0}
    .open-game{justify-self:end;border:0;background:transparent;padding:8px 0;position:relative;letter-spacing:.12em}
    main{height:calc(100vh - 86px);min-height:600px;display:grid;grid-template-rows:1fr 92px;padding:0 clamp(26px,4.5vw,72px);position:relative;z-index:3}
    .hero{display:grid;grid-template-columns:minmax(390px,.78fr) minmax(540px,1.22fr);min-height:0}
    .copy{align-self:center;padding-bottom:5vh;position:relative;z-index:8}
    .copy:before{content:"";position:absolute;left:-28px;top:-30px;width:140px;height:100px;background-image:linear-gradient(rgba(51,53,51,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(51,53,51,.13) 1px,transparent 1px);background-size:24px 24px;mask-image:linear-gradient(135deg,#000,transparent 70%);z-index:-1}
    h1{font:500 clamp(47px,5vw,76px)/1.42 'Songti SC','STSong',serif;letter-spacing:.04em;margin:0 0 24px;max-width:680px}
    .lede{font:400 clamp(14px,1.25vw,18px)/2 'Songti SC',serif;margin:0 0 28px;color:#50514e;max-width:350px;letter-spacing:.08em}
    .actions{display:flex;align-items:center;gap:34px}.primary{border:0;background:#292b29;color:#f2ede4;padding:17px 43px;min-width:196px;clip-path:polygon(2% 8%,97% 1%,100% 86%,94% 100%,4% 94%,0 22%);letter-spacing:.14em;transition:transform .25s,background .25s}.primary:hover{transform:rotate(-1deg) translateY(-2px);background:#3b403c}.secondary{border:0;background:transparent;border-bottom:1px solid #6d6e69;padding:8px 0;letter-spacing:.1em}
    .artboard{position:relative;min-width:0;perspective:1000px}.wash{position:absolute;width:72%;height:53%;right:7%;top:21%;background:radial-gradient(ellipse at center,rgba(113,142,149,.22),transparent 63%);filter:blur(11px)}
    .umbrella-open{position:absolute;z-index:4;width:min(48vw,710px);right:1%;top:-2%;filter:saturate(.82) sepia(.08);transform:rotate(4deg);transform-origin:center;pointer-events:none;mix-blend-mode:multiply}
    .figure{position:absolute;z-index:6;bottom:-8%;pointer-events:none;filter:saturate(.75) contrast(.94);mask-image:linear-gradient(#000 76%,transparent 98%)}.young-mother{height:min(56vw,760px);right:7%}.child{height:min(43vw,580px);right:32%;bottom:-3%}
    .photo{position:absolute;z-index:2;padding:7px;background:#f3ede2;box-shadow:0 13px 30px rgba(68,52,34,.16);clip-path:polygon(0 5%,12% 0,23% 4%,38% 1%,53% 4%,66% 0,79% 3%,91% 1%,100% 6%,97% 23%,100% 42%,98% 58%,100% 78%,96% 100%,81% 97%,68% 100%,52% 97%,36% 100%,20% 97%,0 100%,3% 79%,0 61%,2% 44%,0 25%);transition:transform .4s}.photo img{width:100%;height:100%;display:block;object-fit:cover;filter:saturate(.72) sepia(.15);transition:opacity .3s}.photo-a{width:min(28vw,400px);aspect-ratio:1.7;left:1%;top:8%;transform:rotate(-5deg)}.photo-b{width:min(27vw,380px);aspect-ratio:1.62;right:-2%;bottom:3%;transform:rotate(5deg)}
    .note{position:absolute;z-index:8;right:1%;top:25%;font:400 clamp(14px,1.3vw,19px)/1.8 'STKaiti','KaiTi',serif;color:#68655f;transform:rotate(-8deg);letter-spacing:.1em}.note:after{content:"";display:block;width:130%;height:1px;background:#79736b;margin-top:4px;transform:rotate(-3deg)}
    .thread{position:absolute;inset:0;z-index:7;width:100%;height:100%;pointer-events:none;overflow:visible}.thread path{fill:none;stroke:var(--red);stroke-width:2;stroke-linecap:round;stroke-dasharray:1300;stroke-dashoffset:1300;animation:draw 2.4s .4s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}
    .folio{display:grid;grid-template-columns:repeat(3,1fr);max-width:760px;border-top:1px solid rgba(49,50,47,.22);align-self:end}.chapter{height:92px;border:0;border-right:1px solid rgba(49,50,47,.16);background:transparent;text-align:left;padding:0 24px;color:#96928b;font:400 15px/1 'Songti SC',serif;position:relative}.chapter:last-child{border-right:0}.chapter b{font:400 30px/1 Georgia,serif;margin-right:22px}.chapter.active{color:var(--ink)}.chapter:after{content:"";position:absolute;left:0;bottom:0;width:0;height:2px;background:var(--ink);transition:width .4s}.chapter.active:after{width:60%}
    .story-layer{position:fixed;inset:0;z-index:30;background:var(--paper);display:grid;grid-template-columns:1fr 1fr;transform:translateX(105%);transition:transform .8s cubic-bezier(.76,0,.24,1);box-shadow:-30px 0 80px rgba(30,25,20,.2)}.story-layer.open{transform:none}.story-image{background:linear-gradient(rgba(25,19,14,.25),rgba(25,19,14,.25)),url('../game-chapter3/assets/environments/chapter3/rooftop/environment_ch03_rooftop_full_scene.png') center/cover}.story-copy{padding:9vw;display:flex;flex-direction:column;justify-content:center}.story-copy h2{font:500 clamp(45px,6vw,84px)/1.2 'Songti SC',serif;margin:0}.story-copy p{line-height:2;color:#66625c}.story-copy button{width:max-content;border:0;border-bottom:1px solid;background:transparent;padding:10px 0;margin-top:28px;letter-spacing:.12em}
    .variant-nav{position:absolute;right:17px;top:50%;z-index:14;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}.variant-nav a{display:grid;place-items:center;width:30px;height:30px;border:1px solid #bdb4a6;text-decoration:none;font:10px ui-monospace,monospace;color:#777068;background:rgba(239,233,221,.78)}.variant-nav a[aria-current=true]{border-color:var(--red);color:#6e2c26}
    @media(max-width:850px){header{height:70px;grid-template-columns:1fr auto;padding:0 20px}nav{display:none}.hero{grid-template-columns:1fr}.copy{align-self:end;padding:0 0 40vh}.copy h1{font-size:clamp(40px,12vw,64px);line-height:1.28;max-width:520px;text-shadow:0 1px rgba(255,255,255,.8)}.lede{font-size:14px;max-width:280px}.artboard{position:absolute;inset:70px 0 86px;z-index:-1;opacity:.68}.young-mother{height:72vh;right:-35%;bottom:-20%}.child{height:55vh;right:-2%;bottom:-16%}.umbrella-open{width:90vw;right:-29%;top:15%}.photo-a,.photo-b{display:none}.note{display:none}main{height:calc(100vh - 70px);padding:0 20px;min-height:560px}.folio{height:76px}.chapter{height:76px;padding:0 10px;font-size:12px}.chapter b{font-size:21px;margin-right:7px}.actions{gap:16px}.primary{min-width:158px;padding:14px 22px}.secondary{white-space:nowrap}.variant-nav{display:none}.story-layer{grid-template-columns:1fr}.story-image{display:none}.story-copy{padding:12vw}.thread{opacity:.52}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.thread path{stroke-dashoffset:0}}
  </style>
</head>
<body>
  <div class="page" id="page">
    <header><a class="brand" href="index.html" aria-label="返回设计方案首页"><strong>不断线</strong><small>ECHOES OF US</small></a><nav aria-label="主导航"><a href="#story">故事</a><a href="#chapters">章节</a><a href="#notes">创作手记</a></nav><button class="open-game" id="openGame" type="button">打开游戏</button></header>
    <main>
      <section class="hero">
        <div class="copy"><h1 id="headline">沿着那根线，<br>回到记忆里。</h1><p class="lede" id="lede">她向前走，母亲学着放手。<br>距离变远，牵挂没有消失。</p><div class="actions"><button class="primary" id="startStory" type="button">开始故事</button><button class="secondary" id="viewChapter" type="button">查看章节</button></div></div>
        <div class="artboard" id="artboard" aria-label="母女与黄色雨伞的记忆拼贴">
          <span class="wash"></span><div class="photo photo-a"><img id="photoA" src="../game-chapter3/assets/environments/chapter3/stairwell/environment_ch03_stairwell_full_scene.png" alt="旧屋楼道"></div><div class="photo photo-b"><img id="photoB" src="../game-chapter3/assets/environments/chapter3/rooftop/environment_ch03_rooftop_full_scene.png" alt="天台暮色"></div>
          <img class="umbrella-open" src="../game2.5d/art/cute-umbrella-open.png" alt="黄色雨伞">
          <img class="figure young-mother" src="../assets/余秀兰（33）：含情凝望(透).png" alt="年轻的余秀兰">
          <img class="figure child" src="../assets/余念（7）：欣然愉悦(透).png" alt="七岁的余念">
          <p class="note" id="note">那天，<br>雨下得很大。</p>
        </div>
      </section>
      <div class="folio" id="chapters" aria-label="章节"><button class="chapter active" data-index="0" type="button"><b>01</b>旧屋</button><button class="chapter" data-index="1" type="button"><b>02</b>雨巷</button><button class="chapter" data-index="2" type="button"><b>03</b>天台</button></div>
    </main>
    <svg class="thread" viewBox="0 0 1536 1024" preserveAspectRatio="none" aria-hidden="true"><path d="M -80 830 C 190 990, 350 750, 540 840 C 700 920, 620 690, 825 700 S 1090 880, 1260 750 S 1440 540, 1600 620"/></svg>
    <aside class="variant-nav" aria-label="切换设计方案"><a href="cinematic.html">01</a><a href="relationship-lab.html">02</a><a href="storybook.html" aria-current="true">03</a></aside>
  </div>
  <section class="story-layer" id="storyLayer" aria-hidden="true"><div class="story-image"></div><div class="story-copy"><h2>人可以离开彼此，<br>关系不会因此断裂。</h2><p>从旧屋里的相框，到雨中的黄色雨伞，再到终于学会放手的天台。沿着牵挂线，重新理解那些普通得没有被说出口的爱。</p><button id="closeStory" type="button">合上这一页　←</button></div></section>
  <script>
    const chapters=[
      {headline:'沿着那根线，<br>回到记忆里。',lede:'她向前走，母亲学着放手。<br>距离变远，牵挂没有消失。',note:'那天，<br>雨下得很大。',a:'../game-chapter3/assets/environments/chapter3/stairwell/environment_ch03_stairwell_full_scene.png',b:'../game-chapter3/assets/environments/chapter3/rooftop/environment_ch03_rooftop_full_scene.png'},
      {headline:'雨落下来，<br>过去慢慢浮现。',lede:'同一把伞，装着两个人<br>没有说出口的害怕。',note:'伞总是，<br>向我这边倾。',a:'../game-chapter3/assets/environments/chapter3/warehouse/environment_ch03_warehouse_full_scene.png',b:'../game-chapter3/assets/environments/chapter3/stairwell/environment_ch03_stairwell_full_scene.png'},
      {headline:'她继续向前，<br>线仍然连着。',lede:'放手不是失去。<br>是让牵挂变得更安静。',note:'再远一点，<br>也没有关系。',a:'../game-chapter3/assets/environments/chapter3/rooftop/environment_ch03_rooftop_full_scene.png',b:'../game-chapter3/assets/environments/chapter3/warehouse/environment_ch03_warehouse_full_scene.png'}
    ];
    const buttons=[...document.querySelectorAll('.chapter')],root=document.documentElement;
    function selectChapter(i){const item=chapters[i],a=document.querySelector('#photoA'),b=document.querySelector('#photoB');document.querySelector('#headline').innerHTML=item.headline;document.querySelector('#lede').innerHTML=item.lede;document.querySelector('#note').innerHTML=item.note;a.style.opacity=b.style.opacity='.2';setTimeout(()=>{a.src=item.a;b.src=item.b;a.style.opacity=b.style.opacity='1'},180);buttons.forEach((button,n)=>button.classList.toggle('active',n===i))}
    buttons.forEach(b=>b.onclick=()=>selectChapter(Number(b.dataset.index)));document.querySelector('#viewChapter').onclick=()=>{const current=buttons.findIndex(b=>b.classList.contains('active'));selectChapter((current+1)%3)};
    const layer=document.querySelector('#storyLayer');function open(){layer.classList.add('open');layer.setAttribute('aria-hidden','false')}document.querySelector('#startStory').onclick=open;document.querySelector('#openGame').onclick=open;document.querySelector('#closeStory').onclick=()=>{layer.classList.remove('open');layer.setAttribute('aria-hidden','true')};
    const art=document.querySelector('#artboard');window.addEventListener('pointermove',e=>{if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const x=(e.clientX/window.innerWidth-.5)*10,y=(e.clientY/window.innerHeight-.5)*8;art.style.transform=`translate3d(${x}px,${y}px,0)`},{passive:true});
  </script>
</body>
</html>
