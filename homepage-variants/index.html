<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#22211f">
  <title>不断线｜Echoes of Us</title>
  <style>
    @font-face{font-family:noto;src:url('../game2.5d/art/fonts/NotoSansCJKsc-Regular.otf') format('opentype');font-display:swap}
    :root{--paper:#e2d9ca;--muted:#a79e91;--red:#a84c43;--yellow:#c99b43;--graphite:#22211f;--rule:#4a4742;--thread-color:#b76b4d}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--graphite);color:var(--paper);font-family:noto,'PingFang SC',sans-serif}
    button,a{color:inherit;font:inherit}button{cursor:pointer}
    .page{height:100%;display:grid;grid-template-columns:146px 1fr;position:relative;isolation:isolate;background:radial-gradient(circle at 56% 38%,#2b2926 0,transparent 42%),#22211f}
    .page:after{content:"";position:absolute;inset:0;z-index:12;pointer-events:none;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");mix-blend-mode:soft-light}
    .title-rail{border-right:1px solid var(--rule);padding:42px 30px 28px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:8}
    .title-rail a{text-decoration:none}.zh-title{margin:0;writing-mode:vertical-rl;font:400 clamp(45px,5.2vw,74px)/1 'Songti SC',serif;letter-spacing:.08em}.red-rule{width:1px;height:92px;background:var(--red);margin:22px 0}.en-title{writing-mode:vertical-rl;font:400 10px/1.8 ui-monospace,monospace;letter-spacing:.38em;color:#c8bfb0}.knot{margin-top:auto;color:var(--red);font-size:29px;transform:rotate(45deg)}
    .canvas{position:relative;min-width:0;overflow:hidden;touch-action:none}
    .utility{height:80px;display:flex;justify-content:flex-end;align-items:center;gap:20px;padding:0 48px;position:relative;z-index:8}.utility button{background:0;border:0;color:#c8beb0;font-size:13px;letter-spacing:.15em;padding:8px;transition:color .2s}.utility button:hover,.utility button:focus-visible{color:#fff}.utility .slash{color:#6f6961}
    .portrait{position:absolute;width:clamp(205px,20vw,330px);aspect-ratio:1;border-radius:49% 51% 47% 53%;background:#d9cfbf;box-shadow:0 2px 0 #776d61,0 18px 50px rgba(0,0,0,.35);z-index:5;cursor:grab;user-select:none;touch-action:none;transition:box-shadow .2s,filter .35s}
    .portrait:active{cursor:grabbing;box-shadow:0 0 0 1px var(--thread-color),0 25px 70px rgba(0,0,0,.5)}
    .portrait:before{content:"";position:absolute;inset:-8px;border-radius:48% 52% 50% 46%;border:2px solid #a29889;filter:url(#rough);opacity:.65}
    .portrait img{width:100%;height:100%;object-fit:cover;object-position:center 15%;border-radius:inherit;pointer-events:none;filter:saturate(.75) contrast(.94)}
    .portrait .anchor{position:absolute;width:28px;height:28px;border-radius:50%;background:#2b2824;border:5px solid #8a7e6e;box-shadow:inset 0 0 0 3px var(--thread-color),0 2px 10px #000;bottom:-10px;left:50%;transform:translateX(-50%);transition:box-shadow .2s}
    .portrait .name{position:absolute;top:calc(100% + 34px);left:50%;transform:translateX(-50%);white-space:nowrap;font:400 clamp(18px,1.6vw,27px)/1 'Songti SC',serif;letter-spacing:.2em}
    #daughter{left:11%;top:12%}#mother{right:6%;top:20%}
    #threadSvg{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none;overflow:visible;filter:drop-shadow(0 2px 2px #000)}
    #thread{fill:none;stroke:var(--thread-color);stroke-width:3;stroke-linecap:round;transition:stroke .12s}#threadShadow{fill:none;stroke:var(--thread-color);stroke-width:8;stroke-linecap:round;opacity:.2;transition:stroke .12s}
    .state{position:absolute;z-index:6;left:50%;top:45%;transform:translate(-50%,-50%);display:flex;gap:20px;align-items:center;color:#aaa194;font-family:'Songti SC',serif;letter-spacing:.18em;pointer-events:none}.state span{transition:color .2s,border-color .2s}.state span.active{color:var(--thread-color);border-bottom:1px solid var(--thread-color);padding-bottom:7px}.state i{font-style:normal;color:#65605a}
    .instruction{position:absolute;z-index:7;left:50%;bottom:30%;transform:translateX(-50%);color:#aaa195;font:400 14px/1.5 'Songti SC',serif;letter-spacing:.15em;white-space:nowrap}
    .instruction:before,.instruction:after{content:"↝";display:inline-block;margin:0 22px;color:#6d6760}.instruction:before{transform:scaleX(-1)}
    .enter-wrap{position:absolute;z-index:7;left:50%;bottom:8%;transform:translateX(-50%);display:flex;align-items:center;gap:28px}.memory-button{width:174px;height:174px;border-radius:50%;border:1px solid #d1c6b7;background:transparent;color:var(--paper);font:400 25px/1 'Songti SC',serif;letter-spacing:.1em;white-space:nowrap;position:relative}.memory-button:before,.memory-button:after{content:"";position:absolute;border:1px solid rgba(218,205,185,.12);border-radius:50%;inset:-18px;transition:transform .4s,opacity .4s}.memory-button:after{inset:-37px;opacity:.55}.memory-button:hover:before{transform:scale(1.12);opacity:0}.memory-button:hover:after{transform:scale(.9);opacity:.9}.continue{border:0;background:none;color:#b9afa1;border-bottom:1px solid var(--red);padding:8px 0;letter-spacing:.1em}
    .prop{position:absolute;z-index:2;pointer-events:none;filter:saturate(.72) sepia(.16);opacity:.78}.umbrella{width:min(27vw,330px);left:-5%;bottom:-12%;transform:rotate(-28deg)}.frame{width:min(25vw,330px);right:-6%;bottom:-14%;transform:rotate(-14deg)}
    .memory-layer{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:rgba(224,215,199,.96);color:#27231f;clip-path:circle(0 at 50% 76%);transition:clip-path 1s cubic-bezier(.7,0,.2,1);pointer-events:none}.memory-layer.open{clip-path:circle(110% at 50% 76%);pointer-events:auto}.memory-inner{text-align:center;max-width:620px;padding:30px}.memory-inner h2{font:400 clamp(42px,6vw,82px)/1.2 'Songti SC',serif;margin:0}.memory-inner p{line-height:2;color:#6d6257}.memory-inner button{margin-top:24px;padding:13px 30px;border:1px solid #3a332d;background:transparent;letter-spacing:.15em}
    .media-layer{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:42px;background:rgba(24,23,21,.94);backdrop-filter:blur(16px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s,visibility .35s}.media-layer.open{opacity:1;visibility:visible;pointer-events:auto}.media-shell{width:min(1120px,94%);height:min(760px,88%);min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:22px}.media-heading{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid #514b43;padding-bottom:18px}.media-heading p{margin:0 0 7px;color:var(--thread-color);font:11px/1 ui-monospace,monospace;letter-spacing:.24em}.media-heading h2{margin:0;font:400 clamp(30px,4vw,58px)/1 'Songti SC',serif;letter-spacing:.08em}.media-close{width:44px;height:44px;border:1px solid #6a6258;border-radius:50%;background:transparent;color:#ddd2c1;font-size:24px;line-height:1}.media-panel{min-height:0}.media-panel[hidden]{display:none}.trailer-panel{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:28px;align-items:center;height:100%}.trailer-panel video{width:100%;aspect-ratio:967/544;object-fit:contain;max-height:100%;background:#080808;box-shadow:0 28px 80px rgba(0,0,0,.42);border:1px solid #4b4540}.media-note{align-self:end;border-left:1px solid var(--thread-color);padding-left:18px;color:#a9a094;line-height:1.8;font-size:13px}.media-note b{display:block;color:#ded4c5;font:400 21px/1.4 'Songti SC',serif;letter-spacing:.12em;margin-bottom:10px}.poster-grid{height:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;min-height:0}.poster-card{position:relative;overflow:hidden;border:1px solid #5c554c;background:#171614;padding:0;min-height:0;text-align:left}.poster-card img{width:100%;height:100%;object-fit:cover;object-position:center 12%;filter:saturate(.78);transition:transform .5s,filter .4s}.poster-card:hover img,.poster-card:focus-visible img{transform:scale(1.025);filter:saturate(1)}.poster-caption{position:absolute;inset:auto 0 0;padding:54px 22px 18px;background:linear-gradient(transparent,rgba(12,11,10,.94));display:flex;justify-content:space-between;align-items:end}.poster-caption strong{font:400 22px/1 'Songti SC',serif;letter-spacing:.12em}.poster-caption span{color:#aea598;font:10px/1 ui-monospace,monospace;letter-spacing:.18em}.poster-viewer{position:absolute;inset:0;z-index:22;display:block;overflow:auto;text-align:center;background:rgba(12,11,10,.97);padding:28px 80px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,visibility .25s}.poster-viewer.open{opacity:1;visibility:visible;pointer-events:auto}.poster-viewer img{display:block;width:min(900px,100%);height:auto;margin:0 auto;box-shadow:0 20px 70px #000}.poster-viewer .media-close{position:fixed;right:28px;top:28px;background:#211f1c}
    @media(max-width:760px){.page{grid-template-columns:72px 1fr}.title-rail{padding:24px 16px}.zh-title{font-size:39px}.en-title{display:none}.red-rule{height:60px}.utility{height:58px;padding:0 12px;gap:4px}.utility .slash{display:none}.utility button{font-size:11px;padding:7px 5px;letter-spacing:.08em}.portrait{width:44vw}.portrait .name{font-size:16px;top:calc(100% + 22px)}#daughter{left:4%;top:18%}#mother{right:-4%;top:32%}.state{top:15%;font-size:12px;gap:8px}.instruction{bottom:28%;font-size:12px}.instruction:before,.instruction:after{display:none}.enter-wrap{bottom:5%;gap:12px}.memory-button{width:124px;height:124px;flex:0 0 124px;font-size:18px;letter-spacing:.04em}.umbrella{width:220px;left:-26%;bottom:-7%}.frame{width:210px;right:-23%;bottom:-7%}.media-layer{padding:18px}.media-shell{width:100%;height:94%;gap:14px}.media-heading{padding-bottom:12px}.media-heading h2{font-size:30px}.trailer-panel{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;gap:14px}.trailer-panel video{align-self:center}.media-note{align-self:auto}.poster-grid{gap:10px}.poster-caption{padding:45px 12px 12px}.poster-caption strong{font-size:17px}.poster-caption span{display:none}.poster-viewer{padding:10px}.poster-viewer img{max-width:100%;max-height:100%}.poster-viewer .media-close{right:14px;top:14px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="page" id="top">
    <aside class="title-rail"><a href="#top" aria-label="返回页面顶部"><h1 class="zh-title">不断线</h1></a><span class="red-rule"></span><span class="en-title">ECHOES OF US</span><span class="knot">⌁</span></aside>
    <main class="canvas" id="canvas">
      <div class="utility"><button id="openTrailer" type="button">宣传片</button><span class="slash">/</span><button id="openPosters" type="button">游戏海报</button><span class="slash">/</span><button id="sound" type="button">声音 · 关</button></div>
      <svg id="threadSvg" aria-hidden="true"><defs><filter id="rough"><feTurbulence baseFrequency="0.04" numOctaves="2" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/></filter></defs><path id="threadShadow"/><path id="thread"/></svg>
      <div class="portrait" id="daughter" role="button" tabindex="0" aria-label="拖动余念，改变关系距离"><img src="../assets/余念（23）：正常状态(透).png" alt="余念"><span class="anchor"></span><span class="name">余念</span></div>
      <div class="portrait" id="mother" role="button" tabindex="0" aria-label="拖动余秀兰，改变关系距离"><img src="../assets/余秀兰（48）：正常状态(透).png" alt="余秀兰"><span class="anchor"></span><span class="name">余秀兰</span></div>
      <div class="state" aria-live="polite"><span data-state="close">靠近</span><i>/</i><span data-state="tense">拉扯</span><i>/</i><span data-state="stable" class="active">稳定</span></div>
      <p class="instruction">移动她们，感受距离。</p>
      <div class="enter-wrap"><button class="memory-button" id="openMemory" type="button">进入记忆</button><button class="continue" id="continue" type="button">继续游戏</button></div>
      <img class="prop umbrella" src="../game2.5d/art/cute-umbrella.png" alt=""><img class="prop frame" src="../game2.5d/art/photo-frame.png" alt="">
      <section class="memory-layer" id="memoryLayer" aria-hidden="true"><div class="memory-inner"><h2>距离会变，<br>关系不会消失。</h2><p>线没有断。它只是从拉扯，慢慢变成了一种安静的连接。</p><button id="closeMemory" type="button">回到关系实验场</button></div></section>
      <section class="media-layer" id="mediaLayer" aria-hidden="true" aria-labelledby="mediaTitle">
        <div class="media-shell">
          <header class="media-heading">
            <div><p>OFFICIAL MEDIA ARCHIVE</p><h2 id="mediaTitle">游戏宣传片</h2></div>
            <button class="media-close" id="closeMedia" type="button" aria-label="关闭媒体窗口">×</button>
          </header>
          <div class="media-panel trailer-panel" id="trailerPanel">
            <video id="promoVideo" controls preload="metadata" poster="image1.png" src="game-video.mp4">你的浏览器暂不支持视频播放。</video>
            <p class="media-note"><b>一根看不见的线，<br>连接两段人生。</b>游戏宣传片 · 02:03<br>建议佩戴耳机观看</p>
          </div>
          <div class="media-panel poster-grid" id="posterPanel" hidden>
            <button class="poster-card" type="button" data-poster="image1.png" aria-label="完整查看游戏主视觉海报"><img src="image1.png" alt="《余响·牵挂》游戏主视觉宣传海报"><span class="poster-caption"><strong>主视觉海报</strong><span>POSTER 01 · 查看全图</span></span></button>
            <button class="poster-card" type="button" data-poster="image2.png" aria-label="完整查看游戏故事介绍海报"><img src="image2.png" alt="《余响·牵挂》游戏故事背景与玩法宣传海报"><span class="poster-caption"><strong>故事介绍海报</strong><span>POSTER 02 · 查看全图</span></span></button>
          </div>
        </div>
      </section>
      <section class="poster-viewer" id="posterViewer" aria-hidden="true" aria-label="海报全图预览"><button class="media-close" id="closePoster" type="button" aria-label="关闭海报全图">×</button><img id="fullPoster" alt=""></section>
    </main>
  </div>
  <audio id="ambience" loop preload="none" src="../game2.5d/art/House In a Forest Loop.ogg"></audio>
  <script>
    const canvas=document.querySelector('#canvas'),svg=document.querySelector('#threadSvg'),thread=document.querySelector('#thread'),shadow=document.querySelector('#threadShadow');
    const people=[document.querySelector('#daughter'),document.querySelector('#mother')];let dragging=null,offset={x:0,y:0};
    function centerOf(el){const r=el.getBoundingClientRect(),c=canvas.getBoundingClientRect();return{x:r.left-c.left+r.width/2,y:r.top-c.top+r.height-2}}
    function blend(from,to,amount){const parse=hex=>hex.match(/\w\w/g).map(v=>parseInt(v,16)),a=parse(from),b=parse(to);return`rgb(${a.map((v,i)=>Math.round(v+(b[i]-v)*amount)).join(', ')})`}
    function tensionColor(amount){return amount<.5?blend('#7fa596','#c08a4f',amount*2):blend('#c08a4f','#d94f43',(amount-.5)*2)}
    function updateThread(){const c=canvas.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${c.width} ${c.height}`);const a=centerOf(people[0]),b=centerOf(people[1]),dist=Math.hypot(b.x-a.x,b.y-a.y),sag=Math.min(80,dist*.12),d=`M ${a.x} ${a.y} C ${a.x+dist*.28} ${a.y+sag}, ${b.x-dist*.28} ${b.y+sag}, ${b.x} ${b.y}`;thread.setAttribute('d',d);shadow.setAttribute('d',d);const tension=Math.max(0,Math.min(1,(dist-c.width*.24)/(c.width*.5))),color=tensionColor(tension),state=dist<c.width*.36?'close':dist>c.width*.68?'tense':'stable';document.documentElement.style.setProperty('--thread-color',color);canvas.dataset.relationshipState=state;canvas.dataset.threadColor=color;document.querySelectorAll('[data-state]').forEach(el=>el.classList.toggle('active',el.dataset.state===state));thread.style.strokeWidth=`${3+tension*1.5}`;}
    function begin(e){dragging=e.currentTarget;const r=dragging.getBoundingClientRect();offset={x:e.clientX-r.left,y:e.clientY-r.top};dragging.setPointerCapture(e.pointerId)}
    function move(e){if(!dragging)return;const c=canvas.getBoundingClientRect(),w=dragging.offsetWidth,h=dragging.offsetHeight;let x=Math.max(8,Math.min(c.width-w-8,e.clientX-c.left-offset.x)),y=Math.max(70,Math.min(c.height-h-72,e.clientY-c.top-offset.y));dragging.style.left=x+'px';dragging.style.top=y+'px';dragging.style.right='auto';updateThread()}
    function end(){dragging=null}
    function nudge(e){if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const c=canvas.getBoundingClientRect(),r=e.currentTarget.getBoundingClientRect(),step=e.shiftKey?48:16,dx=e.key==='ArrowLeft'?-step:e.key==='ArrowRight'?step:0,dy=e.key==='ArrowUp'?-step:e.key==='ArrowDown'?step:0,x=Math.max(8,Math.min(c.width-r.width-8,r.left-c.left+dx)),y=Math.max(70,Math.min(c.height-r.height-72,r.top-c.top+dy));e.currentTarget.style.left=x+'px';e.currentTarget.style.top=y+'px';e.currentTarget.style.right='auto';updateThread()}
    people.forEach(el=>{el.addEventListener('pointerdown',begin);el.addEventListener('pointermove',move);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('keydown',nudge)});window.addEventListener('resize',updateThread);requestAnimationFrame(updateThread);
    const layer=document.querySelector('#memoryLayer');document.querySelector('#openMemory').onclick=()=>{layer.classList.add('open');layer.setAttribute('aria-hidden','false')};document.querySelector('#continue').onclick=()=>{layer.classList.add('open');layer.setAttribute('aria-hidden','false')};document.querySelector('#closeMemory').onclick=()=>{layer.classList.remove('open');layer.setAttribute('aria-hidden','true')};
    const audio=document.querySelector('#ambience'),sound=document.querySelector('#sound');sound.onclick=async()=>{if(audio.paused){try{await audio.play();sound.textContent='声音 · 开'}catch{sound.textContent='声音不可用'}}else{audio.pause();sound.textContent='声音 · 关'}};
    const mediaLayer=document.querySelector('#mediaLayer'),mediaTitle=document.querySelector('#mediaTitle'),trailerPanel=document.querySelector('#trailerPanel'),posterPanel=document.querySelector('#posterPanel'),promoVideo=document.querySelector('#promoVideo');
    function openMedia(type){const trailer=type==='trailer';mediaTitle.textContent=trailer?'游戏宣传片':'游戏宣传海报';trailerPanel.hidden=!trailer;posterPanel.hidden=trailer;mediaLayer.classList.add('open');mediaLayer.setAttribute('aria-hidden','false');document.querySelector('#closeMedia').focus({preventScroll:true})}
    function closeMedia(){mediaLayer.classList.remove('open');mediaLayer.setAttribute('aria-hidden','true');promoVideo.pause()}
    document.querySelector('#openTrailer').onclick=()=>openMedia('trailer');document.querySelector('#openPosters').onclick=()=>openMedia('posters');document.querySelector('#closeMedia').onclick=closeMedia;
    const posterViewer=document.querySelector('#posterViewer'),fullPoster=document.querySelector('#fullPoster');document.querySelectorAll('[data-poster]').forEach(button=>button.onclick=()=>{posterViewer.scrollTo(0,0);fullPoster.src=button.dataset.poster;fullPoster.alt=button.querySelector('img').alt;posterViewer.classList.add('open');posterViewer.setAttribute('aria-hidden','false');document.querySelector('#closePoster').focus({preventScroll:true});canvas.scrollTo(0,0)});function closePoster(){posterViewer.classList.remove('open');posterViewer.setAttribute('aria-hidden','true');posterViewer.scrollTo(0,0);canvas.scrollTo(0,0);fullPoster.removeAttribute('src')}document.querySelector('#closePoster').onclick=closePoster;
    mediaLayer.addEventListener('pointerdown',event=>{if(event.target===mediaLayer)closeMedia()});posterViewer.addEventListener('pointerdown',event=>{if(event.target===posterViewer)closePoster()});document.addEventListener('keydown',event=>{if(event.key!=='Escape')return;if(posterViewer.classList.contains('open'))closePoster();else if(mediaLayer.classList.contains('open'))closeMedia();else if(layer.classList.contains('open'))document.querySelector('#closeMemory').click()});
  </script>
</body>
</html>
